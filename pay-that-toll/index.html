<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay That Toll Kinetic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Overpass:ital,wght@0,800;0,900;1,900&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --asphalt:#0d0d0f; --bone:#f2eee4; --hazard:#ffd100; --signal:#ff2a1f; --exit:#0b6b3a; --night:#0b1233;
  --paper:#f6f1e3; --ink:#141414; --ink-soft:#5b574d; --line:rgba(242,238,228,.2);
  --mono:"Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --display:"Anton", Impact, "Arial Narrow", sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--asphalt);color:var(--bone);overflow:hidden}
body{font:14px/1.45 var(--mono);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--asphalt);cursor:pointer;touch-action:manipulation}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}

/* ---------- toll booth (loader) ---------- */
.booth{
  position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;
  background:var(--paper);color:var(--ink);padding:18px 18px 16px;display:grid;gap:14px;
  box-shadow:0 0 0 1px rgba(0,0,0,.3),10px 10px 0 var(--hazard);
  border-top:3px dashed var(--ink);
}
.booth .eyebrow{margin:0;display:flex;justify-content:space-between;gap:12px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.booth h1{margin:0;font:400 clamp(40px,10.5vw,56px)/.9 var(--display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.booth .sub{margin:0;font-size:11px;letter-spacing:.1em}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:center;padding:9px 12px;border:2px solid var(--ink);cursor:pointer;transition:background .15s}
.slot:hover{background:rgba(20,20,20,.07)}
.slot .n{grid-row:span 2;font:400 30px/1 var(--display)}
.slot .k{font-weight:700;font-size:12px;letter-spacing:.08em}
.slot .v{font-size:11px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.ok{background:var(--ink);color:var(--paper)}
.slot.ok .v{color:var(--hazard)}
.slot.err .v{color:var(--signal)}
.go{appearance:none;border:0;background:var(--signal);color:var(--paper);font:400 28px/1 var(--display);letter-spacing:.04em;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-transform:uppercase}
.go:hover{filter:brightness(1.08)}
.go:disabled{background:#d6cfbd;color:#857f71;cursor:not-allowed;filter:none}
.booth .note{margin:0;font-size:11px;color:var(--ink-soft)}
.booth .keys{margin:0;font-size:10px;letter-spacing:.06em;color:var(--ink-soft);border-top:1px solid rgba(20,20,20,.18);padding-top:10px}
.booth.min{display:none}

/* ---------- transport bar ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
  padding:26px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(rgba(8,8,10,0),rgba(8,8,10,.88) 45%);color:var(--bone);
  transition:opacity .25s,transform .25s;
}
.bar.hide{opacity:0;transform:translateY(14px);pointer-events:none}
.bar button{appearance:none;background:rgba(13,13,15,.72);border:1px solid var(--line);padding:6px 10px;min-height:34px;font-size:11px;font-weight:700;letter-spacing:.08em;cursor:pointer}
.bar button:hover{border-color:var(--bone)}
.bar button[aria-pressed="true"]{background:var(--hazard);color:var(--ink);border-color:var(--hazard)}
.bar #b-play{min-width:44px;font-size:14px}
.bar #b-rec.on{background:var(--signal);border-color:var(--signal);color:var(--paper)}
.tl{flex:1 1 220px;height:28px;position:relative;cursor:pointer;touch-action:none}
.tl .secs{position:absolute;left:0;right:0;top:10px;height:8px;background:rgba(242,238,228,.12)}
.tl .secs i{position:absolute;top:0;bottom:0;display:block}
.tl .secs i+i{border-left:1px solid var(--asphalt)}
.tl .fill{position:absolute;left:0;top:19px;height:2px;background:var(--bone);width:0}
.tl .head{position:absolute;top:4px;bottom:4px;width:3px;margin-left:-1px;background:var(--bone);left:0}
.bar .time{font-variant-numeric:tabular-nums;font-size:11px;min-width:15ch}
.bar .grp{display:flex;align-items:center;gap:4px}
.bar .sync{font-size:10px;font-variant-numeric:tabular-nums;min-width:11ch;text-align:center;letter-spacing:.06em}
.veil{position:fixed;inset:12px;border:3px dashed var(--hazard);display:grid;place-items:center;background:rgba(13,13,15,.7);pointer-events:none}
.veil span{font:400 clamp(40px,9vw,120px)/1 var(--display);color:var(--hazard)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--hazard);color:var(--ink);padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;max-width:calc(100% - 32px)}
@media (max-width:640px){
  .tl{order:-1;flex-basis:100%}
  .booth .keys{display:none}
  .booth{padding:14px 14px 12px;gap:10px}
}
</style>
</head>
<body>
<canvas id="stage" aria-label="키네틱 타이포그래피 가사 영상"></canvas>

<section class="booth" id="booth" aria-labelledby="booth-title">
  <p class="eyebrow"><span>Toll plaza · lane 04</span><span>Exit 122</span></p>
  <h1 id="booth-title">Pay That Toll</h1>
  <p class="sub">UNOFFICIAL KINETIC LYRIC DEMO · ONEREPUBLIC · 122 BPM</p>
  <ol class="slots">
    <li>
      <label class="slot" id="slot-audio" for="f-audio"><span class="n">01</span><span class="k">음원 MP3</span><span class="v" id="v-audio">파일 선택 또는 화면에 드롭</span></label>
      <input class="vh" type="file" id="f-audio" accept="audio/*,.mp3,.m4a,.wav,.ogg">
    </li>
    <li>
      <label class="slot" id="slot-lyr" for="f-lyr"><span class="n">02</span><span class="k">가사 LRC / TXT</span><span class="v" id="v-lyr">[mm:ss.xx] 타임코드가 붙은 가사 파일</span></label>
      <input class="vh" type="file" id="f-lyr" accept=".lrc,.txt,text/plain">
    </li>
  </ol>
  <button class="go" id="go" type="button" disabled><span>재생</span><span aria-hidden="true">▶</span></button>
  <p class="note" id="note">두 파일을 한 번에 드롭해도 돼요. 파일은 이 브라우저 안에서만 읽고 어디에도 올리지 않아요. 뒤에 보이는 화면은 파일 없이 도는 데모 루프예요.</p>
  <p class="keys">SPACE 재생 · ← → 5초 이동 · [ ] 싱크 보정 · F 전체화면 · H HUD</p>
</section>

<div class="bar hide" id="bar" role="toolbar" aria-label="재생 컨트롤">
  <button type="button" id="b-play" aria-label="재생">▶</button>
  <div class="tl" id="tl" role="slider" tabindex="0" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="secs" id="secs"></div><div class="fill" id="tl-fill"></div><div class="head" id="tl-head"></div>
  </div>
  <span class="time" id="time">00:00.00 / 00:00</span>
  <span class="grp"><button type="button" id="b-sm" aria-label="싱크 10ms 앞당기기">−</button><span class="sync" id="sync">SYNC +0ms</span><button type="button" id="b-sp" aria-label="싱크 10ms 늦추기">+</button></span>
  <button type="button" id="b-flash" aria-pressed="true">FLASH</button>
  <button type="button" id="b-hud" aria-pressed="true">HUD</button>
  <button type="button" id="b-files">FILES</button>
  <button type="button" id="b-rec" hidden>● REC</button>
  <button type="button" id="b-fs">FULL</button>
</div>
<div class="veil" id="veil" hidden><span>DROP TO LOAD</span></div>
<div class="toast" id="toast" hidden></div>

<script>

const bA = bloomA.getContext('2d'), bB = bloomB.getContext('2d');
const grain = document.createElement('canvas'); grain.width = grain.height = 192;
{ const g = grain.getContext('2d'), id = g.createImageData(192, 192);
  for (let i = 0; i < id.data.length; i += 4) { const v = hash(i) > .5 ? 255 : 0; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = hash(i + 7) * 26; }

  const cw = innerWidth, ch = innerHeight; let d = Math.min(devicePixelRatio || 1, 2);

addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; veil.hidden = true; } });
addEventListener('drop', ev => { ev.preventDefault(); dragDepth = 0; veil.hidden = true; if (ev.dataTransfer && ev.dataTransfer.files.length) { booth.classList.remove('min'); takeFiles(ev.dataTransfer.files); } });

// Recording (top-level window only: sandboxed previews block downloads)
const canRec = window.self === window.top && typeof MediaRecorder !== 'undefined' && !!cv.captureStream;
const recBtn = $('b-rec'); recBtn.hidden = !canRec;
recBtn.addEventListener('click', () => {
  if (A.rec) { A.rec.stop(); return; }
  if (!A.buf) { say('녹화하려면 음원을 먼저 넣어 주세요'); return; }
  ensureCtx(); const dest = A.ctx.createMediaStreamDestination(); A.gain.connect(dest);
  const stream = new MediaStream([...cv.captureStream(60).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 16e6 } : undefined); const chunks = [];
  rec.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
  rec.onstop = () => { A.gain.disconnect(dest); A.rec = null; recBtn.classList.remove('on'); recBtn.textContent = '● REC';
    const blob = new Blob(chunks, { type: rec.mimeType || 'video/webm' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `pay-that-toll-kinetic.${(rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm'}`; document.body.appendChild(a); a.click(); a.remove(); say('녹화 파일을 저장했어요'); };
  A.rec = rec; recBtn.classList.add('on'); recBtn.textContent = '■ STOP';
  if (S.mode !== 'song') { S.mode = 'song'; booth.classList.add('min'); }
  pause(); A.pos = 0; rec.start(250); play(); wake();
});
function onEndedRec() { if (A.rec) A.rec.stop(); }

/* ============================ boot ============================ */
function frame() {
  requestAnimationFrame(frame);
  sampleAudio();
  let t;
  if (S.freeze != null) t = S.freeze;
  else if (S.mode === 'song') t = songTime();
  else t = (performance.now() / 1000 - S.demoStart) % S.demoLen;
  render(t);
  if (S.mode === 'song') {
    const d = duration(), raw = clamp(A.playing ? rawTime() : A.pos, 0, d);
    const pct = (raw / d * 100).toFixed(3) + '%'; $('tl-head').style.left = pct; $('tl-fill').style.width = pct;
    tl.setAttribute('aria-valuenow', String(Math.round(raw / d * 100)));
    $('time').textContent = `${fmt(raw)} / ${fmt(d).slice(0, 5)}`;
    if (!A.playing && A.rec) onEndedRec();
  }
}
async function autoload() { // serve the folder with media/song.mp3 + media/lyrics.lrc to skip the file pickers
  try { const r = await fetch('media/song.mp3'); if (r.ok && (r.headers.get('content-type') || '').indexOf('html') < 0) await loadAudioBuffer(() => r.arrayBuffer(), 'media/song.mp3'); } catch (_) {}
  for (const p of ['media/lyrics.lrc', 'media/lyrics.txt']) {
    try { const r = await fetch(p); if (!r.ok) continue; const txt = await r.text(); if (parseLRC(txt).length) { loadLyricsText(txt, p); break; } } catch (_) {}
  }
}
addEventListener('resize', resize);
resize(); measureCaps(); buildDemo(); syncUI(); refreshBooth();
if (document.fonts && document.fonts.load) {
  Promise.all(['400 100px Anton', 'italic 400 100px "Instrument Serif"', '800 100px Overpass', '900 100px Overpass', 'italic 900 100px Overpass', '400 100px "Space Mono"', '700 100px "Space Mono"']
    .map(s => document.fonts.load(s).catch(() => {}))).then(() => { MC.clear(); RC.clear(); STAMPS.clear(); measureCaps(); });
}
requestAnimationFrame(frame);
if (location.protocol !== 'file:') autoload();

// debug hooks for frame checks: PTT.at(seconds) freezes a frame, PTT.run() resumes
window.PTT = { S, at(t, mode = 'song') { S.mode = mode; S.freeze = t; booth.classList.add('min'); }, run() { S.freeze = null; }, lines: () => S.lines.map(L => ({ t0: L.t0, tEnd: L.tEnd, layout: L.layout, kind: L.kind, n: L.words.length })) };
})();
</script>
</body>
